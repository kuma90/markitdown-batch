name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: python build_exe.py

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown批量转换-GUI
          path: dist/MarkItDown批量转换.exe

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown批量转换-CLI
          path: dist/MarkItDown批量转换-CLI.exe
